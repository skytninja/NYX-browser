const PALETTE_URL = "chrome://nyx/content/palette.html";

// Overlays (hive, ⌘K palette) exist only while open, so they cost no memory the rest of the time.
function openOverlay(win, id, url) {
  const doc = win.document;
  if (doc.getElementById("nyx-hive-frame") || doc.getElementById("nyx-palette-frame")) return;
  win.PanelUI.hide();
  const frame = doc.createElementNS("http://www.w3.org/1999/xhtml", "iframe");
  frame.id = id;
  frame.src = url;
  doc.body.append(frame);
  frame.addEventListener("load", () => frame.contentWindow.focus(), { once: true });
}

const openHive = win => openOverlay(win, "nyx-hive-frame", HIVE_URL);

// "-nyx-focus" from another NYX process (⌃1…⌃9, the spaces bar): bring this space forward
// instead of opening one more window. On a normal start the flag is just dropped.
const SPACES_MODULE = "chrome://nyx/content/NyxSpaces.sys.mjs";
(() => {
  const contract = "@nyx/focus-command-line;1";
  const handler = {
    handle(cmdLine) {
      if (!cmdLine.handleFlag("nyx-focus", false)) return;
      if (cmdLine.state === Ci.nsICommandLine.STATE_INITIAL_LAUNCH) return;
      // With every window closed (macOS keeps running), the browser's own handler opens one.
      const win = Services.wm.getMostRecentWindow("navigator:browser");
      if (!win) return;
      cmdLine.preventDefault = true;
      win.focus();
    },
    helpInfo: "",
    QueryInterface: ChromeUtils.generateQI(["nsICommandLineHandler"]),
  };
  Components.manager.QueryInterface(Ci.nsIComponentRegistrar).registerFactory(
    Components.ID("{5c1e0b8a-3f3e-4f0c-9a51-6d2b7c9e4a17}"), "NYX focus", contract,
    { createInstance: iid => handler.QueryInterface(iid) }
  );
  // Runs before the browser's own handler ("m-browser"), which would open a window.
  Services.catMan.addCategoryEntry("command-line-handler", "a-nyx-focus", contract, false, true);
})();

// ⌃1…⌃9: the space with that number in the spaces bar.
async function switchToSpace(number) {
  const { NyxSpaces } = ChromeUtils.importESModule(SPACES_MODULE);
  const space = (await NyxSpaces.list())[number - 1];
  if (space && space.id !== NyxSpaces.currentId) await NyxSpaces.open(space.id);
}

// "Open in space" in the link context menu, filled each time the menu opens.
function addOpenInSpaceMenu(win) {
  const doc = win.document;
  const anchor = doc.getElementById("context-openlinkprivate");
  if (!anchor) return;
  const menu = doc.createXULElement("menu");
  menu.id = "nyx-context-openlinkinspace";
  menu.setAttribute("label", "Открыть в пространстве");
  const popup = doc.createXULElement("menupopup");
  menu.append(popup);
  anchor.after(menu);
  doc.getElementById("contentAreaContextMenu").addEventListener("popupshowing", async event => {
    if (event.target.id !== "contentAreaContextMenu") return;
    const url = win.gContextMenu?.onLink ? win.gContextMenu.linkURL : "";
    menu.hidden = true;
    if (!/^https?:\/\//.test(url)) return;
    const { NyxSpaces } = ChromeUtils.importESModule(SPACES_MODULE);
    const others = (await NyxSpaces.list()).filter(space => space.id !== NyxSpaces.currentId);
    popup.replaceChildren(...others.map(space => {
      const item = doc.createXULElement("menuitem");
      item.setAttribute("label", space.name);
      item.addEventListener("command", () => NyxSpaces.open(space.id, url).catch(Cu.reportError));
      return item;
    }));
    menu.hidden = !others.length;
  });
}

