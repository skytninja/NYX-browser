Services.obs.addObserver(function setNewTabPage() {
  Services.obs.removeObserver(setNewTabPage, "final-ui-startup");
  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  AboutNewTab.newTabURL = HOME_URL;

  // Before the first window, so the saved theme shows without a flash.
  const { NyxTheme } = ChromeUtils.importESModule(THEME_MODULE);
  NyxTheme.apply();
  ChromeUtils.importESModule(SPACES_MODULE).NyxSpaces.startTemporaryHandling().catch(Cu.reportError);

  // DuckDuckGo only. The SearchEngines policy alone leaves some engines behind (eBay).
  const { SearchService } = ChromeUtils.importESModule("moz-src:///toolkit/components/search/SearchService.sys.mjs");
  const removeOtherEngines = async () => {
    for (const engine of await SearchService.getVisibleEngines()) {
      if (engine.name !== "DuckDuckGo") {
        await SearchService.removeEngine(engine, SearchService.CHANGE_REASON.ENTERPRISE);
      }
    }
  };
  SearchService.init().then(removeOtherEngines).catch(Cu.reportError);
  // A search config update can bring engines back while the browser is running.
  Services.obs.addObserver((subject, topic, change) => {
    if (change !== "engine-removed" && change !== "engine-changed") {
      removeOtherEngines().catch(Cu.reportError);
    }
  }, "browser-search-engine-modified");
}, "final-ui-startup");

Services.obs.addObserver(function cleanWindow(win) {
  // Help links lead to Mozilla's sites. The native macOS menu reads the hidden attribute.
  win.document.getElementById("helpMenu")?.setAttribute("hidden", "true");

  const { NyxTabs } = ChromeUtils.importESModule("chrome://nyx/content/NyxTabs.sys.mjs");
  NyxTabs.watch(win);
  const { NyxUpdates } = ChromeUtils.importESModule("chrome://nyx/content/NyxUpdates.sys.mjs");
  NyxUpdates.start();
  const { NyxSpaces } = ChromeUtils.importESModule(SPACES_MODULE);
  NyxSpaces.applyColor(win).catch(Cu.reportError);
  addOpenInSpaceMenu(win);

  // The menu item lives in a lazily created panel, so listen on the whole window.
  win.document.addEventListener("command", event => {
    if (HIVE_TRIGGERS.includes(event.target.id)) {
      openHive(win);
      return;
    }
    if (event.target.id === "key_nyxPalette") {
      openOverlay(win, "nyx-palette-frame", PALETTE_URL);
      return;
    }
    const space = /^key_nyxSpace([1-9])$/.exec(event.target.id);
    if (space) {
      switchToSpace(Number(space[1])).catch(Cu.reportError);
      return;
    }
    if (event.target.id !== "appMenu-nyx-customize") return;
    const { CUSTOMIZE_URL } = ChromeUtils.importESModule(THEME_MODULE);
    win.switchToTabHavingURI(CUSTOMIZE_URL, true, {
      triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal(),
    });
  });
}, "browser-delayed-startup-finished");
