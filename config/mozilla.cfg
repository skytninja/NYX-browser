const HIVE_TRIGGERS = ["key_nyxHive", "nyx-hive-button", "appMenu-nyx-hive"];

// The overview exists only while it's open, so it costs no memory the rest of the time.
function openHive(win) {
  const doc = win.document;
  if (doc.getElementById("nyx-hive-frame")) return;
  win.PanelUI.hide();
  const frame = doc.createElementNS("http://www.w3.org/1999/xhtml", "iframe");
  frame.id = "nyx-hive-frame";
  frame.src = HIVE_URL;
  doc.body.append(frame);
  frame.addEventListener("load", () => frame.contentWindow.focus(), { once: true });
}

