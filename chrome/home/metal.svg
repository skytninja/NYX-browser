<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Paints the icon with bands of silver, blurred together into a liquid-metal gradient. -->
  <filter id="metal" x="0" y="0" width="1" height="1" primitiveUnits="objectBoundingBox" color-interpolation-filters="sRGB">
    <feFlood x="0" y="0" width="1" height=".3" flood-color="#ffffff" result="a"/>
    <feFlood x="0" y=".3" width="1" height=".2" flood-color="#d0d0d0" result="b"/>
    <feFlood x="0" y=".5" width="1" height=".14" flood-color="#8a8a8a" result="c"/>
    <feFlood x="0" y=".64" width="1" height=".18" flood-color="#f0f0f0" result="d"/>
    <feFlood x="0" y=".82" width="1" height=".18" flood-color="#ababab" result="e"/>
    <feMerge result="bands">
      <feMergeNode in="a"/>
      <feMergeNode in="b"/>
      <feMergeNode in="c"/>
      <feMergeNode in="d"/>
      <feMergeNode in="e"/>
    </feMerge>
    <feGaussianBlur in="bands" stdDeviation=".05" result="metal"/>
    <feComposite in="metal" in2="SourceAlpha" operator="in"/>
  </filter>
</svg>
