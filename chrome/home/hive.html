<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src chrome:; img-src chrome: data: page-icon: https:; object-src 'none'" />
    <title>Соты</title>
    <link rel="stylesheet" href="chrome://nyx/content/hive.css" />
  </head>
  <body>
    <main id="viewport" aria-label="Открытые вкладки">
      <div id="world"></div>
    </main>
    <nav id="spaces" aria-label="Пространства"></nav>
    <aside id="trash" aria-label="Отложенные и закрытые вкладки"></aside>
    <div id="snooze" role="dialog" aria-label="Действия" hidden></div>
    <div id="group-bar" role="toolbar" aria-label="Группа из выбранных вкладок" hidden></div>
    <input id="search" type="search" hidden placeholder="Поиск по вкладкам" aria-label="Поиск по вкладкам" autocomplete="off" />
    <p id="hint">Печатай для поиска · ⇧-клик выбрать для группы · перетаскивай поле · щипок или + − зум · стрелки и Enter · Esc закрыть</p>
    <script src="chrome://nyx/content/hive.js"></script>
  </body>
</html>
